<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance List</title>
</head>
<body>
<h2>Attendance List</h2>

<p><a th:href="@{/attendance/form}">Mark Attendance</a> | <a th:href="@{/employees}">Employees</a></p>

<table border="1">
<tr>
    <th>ID</th>
    <th>Employee ID</th>
    <th>Date</th>
    <th>Check In</th>
    <th>Check Out</th>
    <th>Status</th>
</tr>
<tr th:each="att : ${attendanceList}">
    <td th:text="${att.id}"></td>
    <td th:text="${att.employeeId}"></td>
    <td th:text="${att.date}"></td>
    <td th:text="${att.checkIn}"></td>
    <td th:text="${att.checkOut}"></td>
    <td th:text="${att.status}"></td>
</tr>
</table>
</body>
</html>
